name: pr-review

# Advisory: this job posts findings, it never blocks a merge.
# Skipped for fork PRs because `pull_request` events from forks receive no secrets.
on:
  pull_request:
    branches: [dev, main]

permissions:
  contents: read
  pull-requests: write

jobs:
  ai-review:
    name: AI diff review (advisory)
    if: github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - run: npm i -g @alibaba-group/open-code-review

      # Secrets go through env, never interpolated into the command line, so they cannot
      # leak into the step log. Provider setup is `ocr config set`, not flags.
      - name: Configure the model endpoint
        id: cfg
        env:
          PROVIDER_KEY: ${{ secrets.PROVIDER_API_KEY }}
          PROVIDER_URL: ${{ secrets.PROVIDER_BASE_URL || vars.PROVIDER_BASE_URL }}
          REVIEW_MODEL: ${{ vars.REVIEW_MODEL }}
        run: |
          if [ -z "$PROVIDER_KEY" ] || [ -z "$PROVIDER_URL" ]; then
            echo "::warning::PROVIDER_API_KEY / PROVIDER_BASE_URL is not configured - review lane skipped"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # One namespace for all three fields. `providers.<name>` does not exist as a store:
          # the CLI normalises it into custom_providers, so mixing namespaces reads as a bug.
          ocr config set provider gateway
          ocr config set custom_providers.gateway.url "$PROVIDER_URL"
          ocr config set custom_providers.gateway.protocol openai
          ocr config set custom_providers.gateway.api_key "$PROVIDER_KEY"
          ocr config set model "${REVIEW_MODEL:-deepseek-v4.1-flash}"
          # Assert the effective config without printing the key.
          node -e "const c=require(process.env.HOME+'/.opencodereview/config.json'),p=c.custom_providers&&c.custom_providers.gateway;if(!p||!p.url||!p.api_key||p.protocol!=='openai'){console.error('provider config incomplete');process.exit(1)}console.log('provider config ok')"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      # .opencodereview/rule.json is what makes this reviewer better than a generic one.
      # `--format` accepts text|json|sarif only. A token budget caps worst-case spend.
      - name: Review the diff
        if: steps.cfg.outputs.skip == 'false'
        run: |
          # Advisory, but not silent: a bare `|| true` makes a broken lane look like a clean
          # review. Surface the failure as an annotation while still never failing the build.
          set +e
          ocr review --from "origin/${{ github.base_ref }}" --to HEAD \
            --format text --audience agent --effort medium \
            --max-tokens-budget 300000 \
            -o review.md 2>&1 | tee /tmp/ocr.log
          rc=${PIPESTATUS[0]}
          [ $rc -ne 0 ] && echo "::warning::review lane exited $rc - no findings posted, merge is not blocked"
          # Publish cost and latency to the run summary: an expensive reviewer is a reviewer
          # people turn off, so the number has to be visible without digging into logs.
          { echo "### AI review lane"; echo '```'; echo "exit: $rc"; } >> "$GITHUB_STEP_SUMMARY"
          grep -h '^\[ocr\] Summary' /tmp/ocr.log 2>/dev/null >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          exit 0

      - name: Post as a single review comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          test -s review.md || { echo "nothing to post"; exit 0; }
          gh pr review "${{ github.event.number }}" --comment --body-file review.md || true
