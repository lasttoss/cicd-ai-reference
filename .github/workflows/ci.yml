name: ci

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: quality + e2e (blocking)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Measured in docs/evals/cold-start-*.md: browser download is ~20-25 s of the cold run.
      # The key must move when the resolved Playwright version moves. A hand-maintained
      # literal does not: `actions/cache` never overwrites an exact key, so a stale entry
      # would silently disable the cache forever.
      - name: Resolve the Playwright version
        id: pw
        run: |
          # An empty version would produce a constant key that actions/cache never refreshes.
          version="$(npx playwright --version | awk '{print $2}')"
          test -n "$version" || { echo "::error::cannot resolve the Playwright version"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: pw-${{ runner.os }}-${{ steps.pw.outputs.version }}

      # --with-deps still installs the system libraries via apt (~25-35 s); that part is not
      # cacheable. See the baseline document for the option that removes it entirely.
      - run: npx playwright install --with-deps chromium

      # The workflow never inspects the project. It only calls `make`.
      - run: make ci

      # Same Compose stack as local, so "works on my machine" is not a claim.
      - name: Bring the stack up
        run: docker compose up -d --build --wait

      - run: make e2e

      - name: Generate the QA handoff
        if: always()
        env:
          QA_BASE: origin/${{ github.base_ref || 'dev' }}
          QA_PRS: ${{ github.event.number }}
          IMAGE_DIGEST: ${{ github.sha }}
          QA_ENV_URL: compose stack on the runner
        run: make qa-report

      - name: Dump app logs on failure
        if: failure()
        run: docker compose logs --tail=80 app

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: qa-evidence
          path: |
            artifacts/
            reports/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v
