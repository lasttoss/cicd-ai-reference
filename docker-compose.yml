# Local / CI stack. Same file in both places, so "works on my machine" is not a claim.
name: cicd-ai-reference

services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop -d shop"]
      interval: 3s
      timeout: 3s
      retries: 20
    volumes:
      - pgdata:/var/lib/postgresql/data

  migrate:
    build: .
    command: ["node", "scripts/migrate.mjs"]
    environment: &env
      DATABASE_URL: postgres://shop:shop@db:5432/shop
    depends_on:
      db: { condition: service_healthy }

  seed:
    build: .
    command: ["node", "scripts/seed.mjs"]
    environment: *env
    depends_on:
      migrate: { condition: service_completed_successfully }

  app:
    build: .
    image: cicd-ai-reference:${IMAGE_TAG:-local}
    environment: *env
    ports:
      - "127.0.0.1:${APP_PORT:-8080}:8080"
    depends_on:
      seed: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8080/healthz || exit 1"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  pgdata:
